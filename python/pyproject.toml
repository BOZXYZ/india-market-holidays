[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "marketholidays"
version = "0.1.0"
description = "Indian market and bank holidays and business day adjustment (NSE, BSE, MCX, RBI city bank calendars) via the marketholidays.in API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "marketholidays.in", email = "contact@retailbonds.in" }]
keywords = ["india", "holidays", "nse", "bse", "mcx", "rbi", "business-day", "trading-calendar"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["tzdata; platform_system == \"Windows\""]

[project.urls]
Homepage = "https://marketholidays.in/api-docs"
Documentation = "https://marketholidays.in/api-docs"
Source = "https://github.com/YOUR_GITHUB_USER/marketholidays"

[project.scripts]
marketholidays = "marketholidays.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketholidays"]

[tool.pytest.ini_options]
testpaths = ["tests"]
